<!doctype html><html><head><meta charset="utf-8"><title>Drone validation review</title>
<style>body{font:15px system-ui;background:#101822;color:#e4ebf4;margin:24px}h1{font-size:24px}button,select{padding:8px;background:#243348;color:white;border:1px solid #51627a;border-radius:5px}label{margin:0 14px 0 0}canvas{width:100%;background:#172232;border:1px solid #33455b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}pre{white-space:pre-wrap;background:#182434;padding:16px;font-size:12px;max-height:320px;overflow:auto}input[type=range]{width:65%}.muted{color:#a0b2c7}#details{margin:16px 0}a{color:#8cb9ff}@media(max-width:1000px){.grid{grid-template-columns:1fr}}</style></head><body>
<h1>Drone validation review</h1><p class="muted">Source-image coordinates, not physical trajectories. Dark source regions were not observed in this request. No synthetic full-frame imagery is shown.</p>
<button id="prev">Previous</button> <button id="play">Play</button> <button id="next">Next</button>
<input id="slider" type="range" min="0" value="0"><span id="counter"></span>
<p><label><input type="checkbox" id="det" checked>Raw detections (cyan)</label><label><input type="checkbox" id="fresh">Updated tracks (green)</label><label><input type="checkbox" id="coast">Unobserved tracks (orange)</label><label><input type="checkbox" id="sent" checked><b style="color:#ff2d55">SENT to server (red)</b></label><label><input type="checkbox" id="emit">Exported boxes (yellow)</label><label><input type="checkbox" id="gt">Ground truth (pink)</label><label><input type="checkbox" id="trails">Source-coordinate trails</label></p>
<p>Inspect track: <select id="track"><option value="">All</option></select></p>
<div id="details"></div><div class="grid"><div><h3>Received camera image</h3><canvas id="crop" width="960" height="540"></canvas></div><div><h3>Whole-source schematic</h3><canvas id="source" width="960" height="540"></canvas></div></div>
<div class="grid"><div><h3>Frame and selected-track diagnostics</h3><pre id="diagnostic"></pre></div><div><h3>Run summary</h3><pre id="summary"></pre></div></div>
<script>
const DATA=__PAYLOAD__;const rows=DATA.rows;let index=0,timer=null,renderId=0;
const $=id=>document.getElementById(id);$('slider').max=rows.length-1;$('summary').textContent=JSON.stringify(DATA.summary,null,2);
function box(ctx,b,color,label,transform,dash=false){const p=transform(b);ctx.strokeStyle=color;ctx.lineWidth=color==='#ff2d55'?3:2;ctx.setLineDash(dash?[7,4]:[]);ctx.strokeRect(p[0],p[1],p[2]-p[0],p[3]-p[1]);ctx.setLineDash([]);ctx.font='12px monospace';ctx.fillStyle=color;ctx.fillText(label,Math.max(0,p[0]),Math.max(12,p[1]-3));}
function render(){const token=++renderId;const r=rows[index],v=r.request.view,reg=v.source_region_xyxy;const chosen=$('track').value;
$('slider').value=index;$('counter').textContent=` ${index+1}/${rows.length}`;
$('details').textContent=`${r.session_key} | frame ${r.frame}, index ${r.frame_index} | L${v.resolution_level} | ${r.detections.length} detections, ${r.exports.length} exports, ${(r.sent||r.exports).length} sent | ${r.timing_ms.response_ready.toFixed(1)} ms | motion: ${r.motion.reason}`;
$('track').replaceChildren(new Option('All',''));for(const t of r.tracks)$('track').add(new Option(`#${t.id} ${t.class} (${t.status})`,String(t.id)));if(r.tracks.some(t=>String(t.id)===chosen))$('track').value=chosen;
const track=r.tracks.find(t=>String(t.id)===$('track').value);
$('diagnostic').textContent=JSON.stringify({motion:r.motion,camera:r.camera,feedback:r.request.camera_command_feedback,timing:r.timing_ms,errors:r.errors,comparison:r.comparison,selected_track:track,events:r.events},null,2);
const crop=$('crop').getContext('2d'),source=$('source').getContext('2d');crop.clearRect(0,0,960,540);source.clearRect(0,0,960,540);
const scale=[960/r.request.original_width,540/r.request.original_height];
const toSource=b=>[b[0]*scale[0],b[1]*scale[1],b[2]*scale[0],b[3]*scale[1]];
const toCrop=b=>[(b[0]-reg[0])*960/(reg[2]-reg[0]),(b[1]-reg[1])*540/(reg[3]-reg[1]),(b[2]-reg[0])*960/(reg[2]-reg[0]),(b[3]-reg[1])*540/(reg[3]-reg[1])];
function overlays(){box(source,reg,'#7185a1','actual crop',toSource);const command=r.response.requested_view;if(command){const w=r.request.original_width/(2**command.resolution_level),h=r.request.original_height/(2**command.resolution_level);box(source,[command.center_x-w/2,command.center_y-h/2,command.center_x+w/2,command.center_y+h/2],'#a18ce0','requested next crop',toSource,true)}
function both(b,c,label,dash=false){box(crop,b,c,label,toCrop,dash);box(source,b,c,label,toSource,dash)}
if($('det').checked)for(const d of r.detections)both(d.box,'#35d5e8',`${d.class} ${d.score.toFixed(2)}`);
for(const t of r.tracks){if(track&&track.id!==t.id)continue;if((t.updated&&$('fresh').checked)||(!t.updated&&$('coast').checked))both(t.box,t.updated?'#70df98':'#f5a14b',`#${t.id} ${t.class}`,!t.updated);
if($('trails').checked){source.beginPath();source.strokeStyle='#77abcb';t.trail.forEach((p,i)=>{const x=p[0]*scale[0],y=p[1]*scale[1];i?source.lineTo(x,y):source.moveTo(x,y)});source.stroke()}
if(track&&track.id===t.id){source.beginPath();source.strokeStyle='#a5d1ff';source.ellipse(t.state[0]*scale[0],t.state[1]*scale[1],2*Math.sqrt(t.covariance[0][0])*scale[0],2*Math.sqrt(t.covariance[1][1])*scale[1],0,0,2*Math.PI);source.stroke()}}
if($('emit').checked)for(const e of r.exports)both(e.box,'#ffe071',`#${e.track_id??'-'} ${e.class} ${e.score.toFixed(2)} ${e.fresh?'':'P'}`,!e.fresh);
if($('gt').checked)for(const g of r.ground_truth||[])both(g.bbox,'#f487bd',`GT ${g.object_id}`);
if($('sent').checked)for(const e of (r.sent||r.exports)){both(e.box,'#ff2d55',`SENT ${e.class} ${e.score.toFixed(2)}${e.fresh?'':' P'}`,!e.fresh)}
}
if(r.image_data){const img=new Image();img.onload=()=>{if(token!==renderId)return;crop.drawImage(img,0,0,960,540);const b=toSource(reg);source.drawImage(img,b[0],b[1],b[2]-b[0],b[3]-b[1]);overlays()};img.src=r.image_data}else{crop.fillStyle='#c0cddd';crop.fillText('Image not saved for this frame',20,30);overlays()}}
$('prev').onclick=()=>{index=Math.max(0,index-1);render()};$('next').onclick=()=>{index=Math.min(rows.length-1,index+1);render()};$('slider').oninput=e=>{index=+e.target.value;render()};for(const id of ['det','fresh','coast','emit','sent','gt','trails','track'])$(id).onchange=render;
$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='Play'}else{$('play').textContent='Pause';timer=setInterval(()=>{index=(index+1)%rows.length;render()},500)}};render();
</script></body></html>
